# Replace the domain and certificate paths. Enable only after TLS is configured.
server {
    listen 80;
    server_name terv.pelda.hu;
    return 301 https://terv.pelda.hu$request_uri;
}
server {
    listen 443 ssl;
    server_name terv.pelda.hu;
    ssl_certificate /etc/letsencrypt/live/terv.pelda.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terv.pelda.hu/privkey.pem;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
